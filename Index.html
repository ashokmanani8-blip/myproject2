<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom glassmorphism background glow and animations */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .shape-animate {
            animation: float 8s ease-in-out infinite;
        }
        .shape-animate-delayed {
            animation: float 10s ease-in-out infinite 2s;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden p-4">

    <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-600/30 rounded-full blur-3xl shape-animate pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl shape-animate-delayed pointer-events-none"></div>

    <div class="w-full max-w-md z-10">
        <div class="glass-card shadow-2xl rounded-3xl p-8 sm:p-10 relative overflow-hidden">
            
            <!-- Card Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 text-white shadow-lg shadow-indigo-500/30 mb-4 text-xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Welcome Back</h1>
                <p class="text-sm text-slate-400 mt-2">Please enter your details to sign in</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-5">
                
                <!-- Email / Username Field -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required placeholder="name@example.com"
                            class="w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200">
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full pl-11 pr-12 py-3 bg-slate-900/50 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white transition-colors">
                            <i id="eyeIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 transition cursor-pointer">
                        <span class="text-slate-300 group-hover:text-white transition-colors">Remember me</span>
                    </label>
                    <a href="#" onclick="showNotification('Password reset link sent to email!')" class="font-medium text-indigo-400 hover:text-indigo-300 transition-colors">Forgot password?</a>
                </div>

                <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">
                    Sign In
                </button>

                <!-- Divider -->
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-xs uppercase tracking-wider text-slate-500 font-medium">Or continue with</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <!-- Social Logins -->
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="showNotification('Google sign-in simulated!')" class="flex items-center justify-center py-2.5 px-4 bg-slate-900/60 hover:bg-slate-900 border border-slate-700/60 rounded-xl text-sm font-medium text-slate-300 hover:text-white transition-all">
                        <i class="fa-brands fa-google mr-2 text-red-400"></i> Google
                    </button>
                    <button type="button" onclick="showNotification('GitHub sign-in simulated!')" class="flex items-center justify-center py-2.5 px-4 bg-slate-900/60 hover:bg-slate-900 border border-slate-700/60 rounded-xl text-sm font-medium text-slate-300 hover:text-white transition-all">
                        <i class="fa-brands fa-github mr-2 text-white"></i> GitHub
                    </button>
                </div>

            </form>

            <!-- Sign Up Redirect -->
            <div class="text-center mt-6">
                <p class="text-sm text-slate-400">Don't have an account? <a href="#" onclick="showNotification('Redirecting to sign up...')" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">Sign up</a></p>
            </div>

        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-24 opacity-0 transition-all duration-300 bg-slate-900 border border-slate-700 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMessage" class="text-sm font-medium">Success message</span>
    </div>

    <script>
        // Toggle password visibility function
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Handle login simulation
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            showNotification(`Welcome back, ${email.split('@')[0]}!`);
        }

        // Toast notification system (Safe replacement for alert)
        function showNotification(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            
            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3500);
        }
    </script>
</body>
</html>
